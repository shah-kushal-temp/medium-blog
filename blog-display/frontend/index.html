<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Read thoughts, deep dives, and articles on modern technology, architecture, and engineering." />
    <title>Stories — Thoughts, Ideas & Engineering</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Inter:wght@300;400;500;600&family=Source+Serif+4:ital,wght@0,400;0,600;1,400&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
    <!-- Highlight.js -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <link rel="stylesheet" href="/styles/main.css" />
    <link rel="stylesheet" href="/styles/home.css" />
    <link rel="stylesheet" href="/styles/post.css" />
    <link rel="stylesheet" href="/styles/code.css" />
  </head>
  <body>
    <div id="app">
      <!-- Navigation -->
      <nav class="navbar" id="navbar">
        <div class="nav-container">
          <a href="/" class="nav-logo" id="nav-logo">
            <span class="logo-icon">M</span>
            <span class="logo-text">Stories</span>
          </a>
          <div class="nav-actions">
            <a href="#/" class="nav-about-link" id="nav-home-link">Home</a>
            <a href="#/stories" class="nav-about-link" id="nav-stories-link">All Stories</a>
            <a href="#/projects" class="nav-about-link" id="nav-projects-link">Projects</a>
            <a href="#/about" class="nav-about-link" id="nav-about-link">About</a>
            <button class="btn-theme-toggle" id="btn-theme-toggle" title="Toggle dark mode" aria-label="Toggle dark mode">
              <svg class="icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
              <svg class="icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
            </button>
          </div>
            <div class="search-wrapper" id="search-wrapper">
              <button class="search-toggle" id="search-toggle" aria-label="Search">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <circle cx="11" cy="11" r="8"></circle>
                  <path d="m21 21-4.3-4.3"></path>
                </svg>
              </button>
              <div class="search-bar" id="search-bar">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <circle cx="11" cy="11" r="8"></circle>
                  <path d="m21 21-4.3-4.3"></path>
                </svg>
                <input type="text" id="search-input" placeholder="Search stories..." autocomplete="off" />
                <button class="search-close" id="search-close" aria-label="Close search">✕</button>
              </div>
            </div>
          </div>
        </nav>

      <!-- Main Content Area -->
      <main id="main-content"></main>

      <!-- Footer -->
      <footer class="footer">
        <div class="footer-container">
          <div class="footer-content">
            <p class="footer-text">Stories, technical writings & engineering ideas</p>
            <p class="footer-sub">Explore articles on modern software engineering</p>
          </div>
        </div>
      </footer>

      <!-- ===== Medium-Style Sign in with email Modal (Image 1) ===== -->
      <div class="modal-overlay login-overlay" id="login-modal-overlay" style="display:none;">
        <div class="login-modal medium-login-card" id="login-modal">
          <button class="modal-close login-modal-close-btn" id="login-modal-close" aria-label="Close">✕</button>
          <div class="medium-login-body">
            <div class="login-flying-mail-icon">
              <svg width="60" height="60" viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="1.8">
                <path d="M14 36L18 34" stroke-linecap="round"/>
                <path d="M12 41L21 38" stroke-linecap="round"/>
                <g transform="rotate(-15 36 32)">
                  <rect x="18" y="16" width="36" height="24" rx="2" stroke="currentColor" fill="none" stroke-width="1.8"/>
                  <path d="M18 16L36 30L54 16" stroke="currentColor" stroke-width="1.8"/>
                  <path d="M18 40L31 28" stroke="currentColor" stroke-width="1.4"/>
                  <path d="M54 40L41 28" stroke="currentColor" stroke-width="1.4"/>
                </g>
              </svg>
            </div>
            
            <h2 class="medium-login-title">Sign in with email</h2>

            <form id="client-login-form" class="medium-login-form">
              <div class="medium-form-group">
                <label class="medium-input-label" for="client-login-email">Your email</label>
                <div class="medium-input-wrapper">
                  <input type="email" class="medium-email-input" id="client-login-email" placeholder="Enter your email address" required autocomplete="email" />
                  <span class="medium-input-badge">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0f9b6c" stroke-width="2"><rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>
                  </span>
                </div>
              </div>

              <label class="medium-remember-row">
                <input type="checkbox" id="client-login-remember" checked />
                <span class="medium-checkbox-box">
                  <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5"><polyline points="20 6 9 17 4 12"/></svg>
                </span>
                <span class="medium-remember-text">Remember me for faster sign in</span>
              </label>

              <div class="medium-btn-row">
                <button type="submit" class="btn-medium-continue" id="client-btn-continue">Continue</button>
              </div>

              <div class="medium-back-link">
                <button type="button" class="btn-back-signin" id="client-btn-back">Back to sign in options</button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>

    <script type="module" src="/scripts/app.js"></script>
  </body>
</html>
